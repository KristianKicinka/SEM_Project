[supervisord]
nodaemon=true

[program:laravel_default_queue_worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work --queue=default --timeout=440
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/default_worker.log

[program:laravel_process_queue_workers]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work --queue=process_queue --timeout=440
autostart=true
autorestart=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/process_worker.log
