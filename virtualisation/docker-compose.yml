version: '3.8'

services:
    # Main app container
    web:
        image: hashapp:latest
        container_name: hashapp_web
        build:
            target: web
            context: .
        env_file:
            - ../.env
        ports:
            - "8081:80"
        depends_on:
            - db
        volumes:
            -   shared_dir:/var/www/html/storage

    # Database container
    db:
        image: mariadb
        container_name: hashapp_db
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: sem_project
            MYSQL_USER: sem_project
            MYSQL_PASSWORD: password
        ports:
            - "3306:3306"

    # Android emulator container 01
    emulator_01:
        image: emulator_vm:latest
        container_name: emulator_01
        networks:
            - em_net_01
        volumes:
            -   shared_dir:/mnt/storage
        depends_on:
            - web

    # Android emulator container 02
    emulator_02:
        image: emulator_vm:latest
        container_name: emulator_02
        networks:
            - em_net_02
        volumes:
            - shared_dir:/mnt/storage
        depends_on:
            - web

# Network adapter for emulator 02
networks:
    # Network adapter for emulator 01
    em_net_01:
        driver: bridge
        driver_opts:
            com.docker.network.bridge.name: br-em-01

    # Network adapter for emulator 02
    em_net_02:
        driver: bridge
        driver_opts:
            com.docker.network.bridge.name: br-em-02

# Shared directory for APK files
volumes:
    shared_dir:
        driver: local

