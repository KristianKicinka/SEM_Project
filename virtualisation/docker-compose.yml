version: '3.8'

services:
    web:
        image: hashapp:latest
        container_name: hashapp_web
        build:
            target: web
            context: .
        env_file:
            - ../.env
        ports:
            - "8081:80"
        depends_on:
            - db

    db:
        image: mariadb
        container_name: hashapp_db
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: sem_project
            MYSQL_USER: sem_project
            MYSQL_PASSWORD: password
        ports:
            - "3306:3306"

networks:
    app:
        driver: bridge
    
